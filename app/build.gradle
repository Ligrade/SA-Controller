plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dynamicagence.icontroller'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dynamicagence.icontroller'
        minSdk 28          // Android 9 : API BluetoothHidDevice obligatoire
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

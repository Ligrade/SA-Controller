name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: ./gradlew assembleRelease

      - name: Nommer l'APK
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "SA-Controller-v${VERSION}.apk"
          echo "APK=SA-Controller-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Publier la release (APK téléchargeable directement)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APK#SA-Controller-v}"; TAG="${TAG%.apk}"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "SA Controller $TAG" --notes "Télécharge le fichier .apk puis ouvre-le sur le téléphone Android pour l'installer."
